<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gallery - Artist Submission</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        h2 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h3 {
            font-size: 14px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        input[type="text"] {
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            border-radius: 0;
            outline: none;
            box-sizing: border-box;
        }
        p {
            margin: 5px 0 15px 0;
            color: #555555;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="checkbox"] {
            accent-color: #000000;
            cursor: pointer;
        }
        .floorplan-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
        }
        input[type="submit"] {
            font-family: inherit;
            font-size: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            margin-top: 30px;
            cursor: pointer;
            width: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }
        input[type="submit"]:hover {
            background-color: #333333;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>Nova Gallery — Location & Plaque Form</h2>
    
    <form id="galleryForm">
        <input type="hidden" name="access_key" value="ba406d16-9b73-4b6c-aaf7-e1ead6a55b0f">

        <label for="artist_name">Artist Name</label>
        <input type="text" id="artist_name" name="Artist Name" placeholder="Full name" required>

        <label for="work_title">Work Title</label>
        <input type="text" id="work_title" name="Work Title" placeholder="Title of piece" required>

        <h3>Gallery Floor Plan</h3>
        <p>Refer to the map below to choose your top location preferences.</p>
        <img src="floorplan.png" alt="Gallery Floor Plan" class="floorplan-img">

        <h3>Preferred Locations</h3>
        <p>Select exactly 3 spots from the floor plan.</p>

        <div class="checkbox-group">
            <label><input type="checkbox" name="Preferred Locations" value="Spot 1" class="location-check"> Location 1</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 2" class="location-check"> Location 2</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 3" class="location-check"> Location 3</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 4" class="location-check"> Location 4</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 5" class="location-check"> Location 5</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 6" class="location-check"> Location 6</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 7" class="location-check"> Location 7</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 8" class="location-check"> Location 8</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 9" class="location-check"> Location 9</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 10" class="location-check"> Location 10</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 11" class="location-check"> Location 11</label>
            <label><input type="checkbox" name="Preferred Locations" value="Spot 12" class="location-check"> Location 12</label>
        </div>

        <input type="submit" id="submitBtn" value="Submit Preference">
    </form>

<script>
    const checkboxes = document.querySelectorAll('.location-check');
    const requiredSelection = 3;
    const form = document.getElementById('galleryForm');
    const submitBtn = document.getElementById('submitBtn');

    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', () => {
            const checkedCount = document.querySelectorAll('.location-check:checked').length;
            if (checkedCount > requiredSelection) {
                checkbox.checked = false;
                alert('You can only select up to 3 locations.');
            }
        });
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const checkedCount = document.querySelectorAll('.location-check:checked').length;
        if (checkedCount !== requiredSelection) {
            alert('Please select exactly 3 locations before submitting.');
            return;
        }

        submitBtn.value = "Sending...";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "thanks.html";
            } else {
                alert('Submission failed. Please try again.');
                submitBtn.value = "Submit Preference";
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('Network error. Please try again.');
            submitBtn.value = "Submit Preference";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
