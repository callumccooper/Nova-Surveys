<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gallery - Artist Submission</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        h2 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h3 {
            font-size: 14px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], textarea {
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            border-radius: 0;
            outline: none;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 40px;
        }
        p {
            margin: 5px 0 15px 0;
            color: #555555;
        }
        .checkbox-group, .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .regions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        label.inline-label {
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="checkbox"], input[type="radio"] {
            accent-color: #000000;
            cursor: pointer;
        }
        .floorplan-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
        }
        .virtual-tour-prompt {
            margin-top: 25px;
            margin-bottom: 5px;
            font-size: 13px;
            color: #000000;
        }
        .virtual-tour-link {
            color: #000000;
            text-decoration: underline;
            font-weight: bold;
        }
        .virtual-tour-link:hover {
            color: #555555;
        }
        input[type="submit"] {
            font-family: inherit;
            font-size: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            margin-top: 30px;
            cursor: pointer;
            width: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }
        input[type="submit"]:hover {
            background-color: #333333;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .piece-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ccc;
        }
        .piece-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <h2>Nova Gallery - Location Form</h2>
    
    <form id="galleryForm">
        <input type="hidden" name="access_key" value="ba406d16-9b73-4b6c-aaf7-e1ead6a55b0f">

        <!-- Artist Name -->
        <label for="artist_name">Artist Name</label>
        <input type="text" id="artist_name" name="Artist Name" placeholder="Full name" required>

        <!-- Quick Opt-out Choice -->
        <div class="checkbox-group" style="margin-top: 25px;">
            <label class="inline-label">
                <input type="checkbox" id="skip_preference" name="Selection Preference" value="Decide for me">
                This is too long, I don't care — you decide
            </label>
        </div>

        <!-- Dynamic Detailed Section -->
        <div id="detailed_section">
            <label for="piece_count">Number of Pieces</label>
            <input type="number" id="piece_count" name="Number of Pieces" min="1" max="8" value="1">

            <!-- Dynamic Piece Titles Container -->
            <div id="piece_titles_container">
                <h3>Work Titles</h3>
                <div id="titles_list"></div>
            </div>

            <!-- Layout Arrangement Option -->
            <h3>Arrangement Preference</h3>
            <div class="radio-group">
                <label class="inline-label">
                    <input type="radio" name="Arrangement" value="Together" checked> Together in one area
                </label>
                <label class="inline-label">
                    <input type="radio" name="Arrangement" value="Apart"> Spread apart across regions
                </label>
            </div>

            <!-- Virtual Tour Link & Floor Plan -->
            <p class="virtual-tour-prompt">
                <a href="https://callumccooper.github.io/NovaVirtualGallery/" target="_blank" rel="noopener noreferrer" class="virtual-tour-link">Walk virtually around the space here</a>.
            </p>

            <h3>Gallery Floor Plan</h3>
            <p>Refer to the map below to select your region preferences.</p>
            <img src="floorplan.png" alt="Gallery Floor Plan" class="floorplan-img">

            <h3>Preferred Regions</h3>
            <p id="region_instructions">Select 1 region for all pieces.</p>

            <div id="together_regions" class="regions-grid"></div>
            <div id="apart_regions" style="display: none;"></div>
        </div>

        <!-- Additional Notes / Anything Else Field -->
        <label for="additional_notes" style="margin-top: 30px;">Anything else I need to know?</label>
        <input type="text" id="additional_notes" name="Additional Notes" placeholder="Literally anything">

        <input type="submit" id="submitBtn" value="Submit Preference">
    </form>

<script>
    const form = document.getElementById('galleryForm');
    const submitBtn = document.getElementById('submitBtn');
    const skipCheckbox = document.getElementById('skip_preference');
    const detailedSection = document.getElementById('detailed_section');
    const pieceCountInput = document.getElementById('piece_count');
    const titlesList = document.getElementById('titles_list');
    const arrangementRadios = document.querySelectorAll('input[name="Arrangement"]');
    const regionInstructions = document.getElementById('region_instructions');
    const togetherRegionsDiv = document.getElementById('together_regions');
    const apartRegionsDiv = document.getElementById('apart_regions');

    // Updated total regions to 8
    const totalRegions = 8;

    // Toggle Detailed Section and Disable/Enable its inputs
    skipCheckbox.addEventListener('change', () => {
        const isSkipped = skipCheckbox.checked;
        detailedSection.style.display = isSkipped ? 'none' : 'block';

        // Enable or disable inputs inside detailedSection
        const detailedInputs = detailedSection.querySelectorAll('input, select');
        detailedInputs.forEach(input => {
            input.disabled = isSkipped;
        });
    });

    // Dynamically build and manage active inputs
    function updateFormFields() {
        if (skipCheckbox.checked) return;

        const count = parseInt(pieceCountInput.value) || 1;
        const arrangement = document.querySelector('input[name="Arrangement"]:checked').value;

        // 1. Render Dynamic Titles
        titlesList.innerHTML = '';
        for (let i = 1; i <= count; i++) {
            const div = document.createElement('div');
            div.className = 'piece-item';
            div.innerHTML = `
                <label for="work_title_${i}">Piece ${i} Title</label>
                <input type="text" id="work_title_${i}" name="Piece ${i} Title" placeholder="Title of piece ${i}" required>
            `;
            titlesList.appendChild(div);
        }

        // 2. Render Region Selection Modes
        if (arrangement === 'Together') {
            regionInstructions.textContent = 'Select 1 region for all pieces:';
            togetherRegionsDiv.style.display = 'grid';
            apartRegionsDiv.style.display = 'none';

            // Disable apart regions so they don't submit to Web3Forms
            apartRegionsDiv.innerHTML = '';

            togetherRegionsDiv.innerHTML = '';
            for (let r = 1; r <= totalRegions; r++) {
                const label = document.createElement('label');
                label.className = 'inline-label';
                label.innerHTML = `<input type="radio" name="Together Region" value="Region ${r}"> Region ${r}`;
                togetherRegionsDiv.appendChild(label);
            }
        } else {
            regionInstructions.textContent = `Assign a region for each of your ${count} piece(s):`;
            togetherRegionsDiv.style.display = 'none';
            apartRegionsDiv.style.display = 'block';

            // Disable together regions so they don't submit to Web3Forms
            togetherRegionsDiv.innerHTML = '';

            apartRegionsDiv.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const pieceBlock = document.createElement('div');
                pieceBlock.className = 'piece-item';
                
                let optionsHtml = '';
                for (let r = 1; r <= totalRegions; r++) {
                    optionsHtml += `<option value="Region ${r}">Region ${r}</option>`;
                }

                pieceBlock.innerHTML = `
                    <label for="piece_region_${i}">Region for Piece ${i}</label>
                    <select id="piece_region_${i}" name="Piece ${i} Region" style="width: 100%; padding: 8px 0; border: none; border-bottom: 1px solid #000; background: transparent; font-family: inherit;">
                        ${optionsHtml}
                    </select>
                `;
                apartRegionsDiv.appendChild(pieceBlock);
            }
        }
    }

    pieceCountInput.addEventListener('input', updateFormFields);
    arrangementRadios.forEach(radio => radio.addEventListener('change', updateFormFields));

    // Initialize fields
    updateFormFields();

    // Form Submit Handler
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Check required single region if not skipping
        if (!skipCheckbox.checked) {
            const arrangement = document.querySelector('input[name="Arrangement"]:checked').value;
            if (arrangement === 'Together') {
                const selectedTogether = document.querySelector('input[name="Together Region"]:checked');
                if (!selectedTogether) {
                    alert('Please select 1 preferred region.');
                    return;
                }
            }
        }

        submitBtn.value = "Sending...";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "thanks.html";
            } else {
                alert('Submission failed. Please try again.');
                submitBtn.value = "Submit Preference";
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('Network error. Please try again.');
            submitBtn.value = "Submit Preference";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
