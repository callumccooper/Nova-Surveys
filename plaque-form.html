<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gallery - Plaque Submission</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        h2 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Plaque Preview Square */
        .plaque-box {
            border: 1px solid #000000;
            aspect-ratio: 1 / 1;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #ffffff;
        }

        /* Fluid Inline Fields Layout */
        .inline-field-group {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .plaque-header {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Auto-sizing Input Styling */
        input.auto-size {
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            border: none;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            color: #000000;
            min-width: 20px;
            width: auto;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #888888;
        }

        textarea {
            font-family: inherit;
            font-size: 13px;
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            padding: 2px 0;
            color: #000000;
            box-sizing: border-box;
            resize: none;
            height: 110px;
            line-height: 1.4;
        }

        .word-count {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-bottom: 8px;
        }
        .word-count.over-limit {
            color: #d93025;
            font-weight: bold;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            font-size: 13px;
            margin-top: 4px;
        }

        select {
            font-family: inherit;
            font-size: 13px;
            border: none;
            border-bottom: 1px solid #eee;
            background: transparent;
            outline: none;
            cursor: pointer;
            width: 100%;
            padding: 2px 0;
        }

        input[type="submit"] {
            font-family: inherit;
            font-size: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }
        input[type="submit"]:hover {
            background-color: #333333;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Hidden Mirror Element for calculating width */
        #text-measurer {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            white-space: pre;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h2>Plaque Details Submission</h2>
    
    <form id="plaqueForm">
        <input type="hidden" name="access_key" value="ba406d16-9b73-4b6c-aaf7-e1ead6a55b0f">

        <!-- Hidden Span for Input Width Calculations -->
        <span id="text-measurer"></span>

        <!-- Square Plaque Layout Container -->
        <div class="plaque-box">
            
            <!-- Top Section: Piece Title & Artist Name -->
            <div>
                <div class="inline-field-group plaque-header">
                    <input type="text" name="Piece Title" class="auto-size" placeholder="Piece Title" required>
                    <span>,&nbsp;</span>
                    <input type="text" name="Artist Name" class="auto-size" placeholder="Artist Name" required>
                </div>

                <!-- Description Paragraph with Word Counter -->
                <textarea id="descInput" name="Description" placeholder="Description..." required></textarea>
                <div id="wordCountDisplay" class="word-count">0 / 100 words</div>
            </div>

            <!-- Bottom Section: Technical Details & Meta -->
            <div>
                <div class="meta-line">
                    <span>Audio:&nbsp;</span>
                    <input type="text" name="Audio Track" class="auto-size" placeholder="Song / Audio Track (optional)" style="flex-grow: 1;">
                </div>

                <div class="meta-line">
                    <input type="text" name="Medium & Materials" class="auto-size" placeholder="Medium (e.g., Oil on canvas)" style="width: 100%;" required>
                </div>

                <div class="meta-line">
                    <input type="text" name="Dimensions" class="auto-size" placeholder="Dimensions (e.g., 61.5 x 61 cm)" style="width: 100%;" required>
                </div>

                <div class="meta-line">
                    <span>(</span>
                    <input type="text" name="Year" class="auto-size" placeholder="2026" required>
                    <span>)</span>
                </div>

                <div class="meta-line" style="margin-top: 8px;">
                    <select name="For Sale" required>
                        <option value="" disabled selected>For sale?</option>
                        <option value="Available for sale">Available for sale</option>
                        <option value="NFS (Not for sale)">NFS (Not for sale)</option>
                    </select>
                </div>
            </div>

        </div>

        <input type="submit" id="submitBtn" value="Submit Plaque Info">
    </form>

<script>
    const form = document.getElementById('plaqueForm');
    const submitBtn = document.getElementById('submitBtn');
    const descInput = document.getElementById('descInput');
    const wordCountDisplay = document.getElementById('wordCountDisplay');
    const measurer = document.getElementById('text-measurer');
    const MAX_WORDS = 100;

    // Auto-resize inputs as user types
    function resizeInput(input) {
        const style = window.getComputedStyle(input);
        measurer.style.fontSize = style.fontSize;
        measurer.style.fontWeight = style.fontWeight;
        
        const text = input.value || input.placeholder || '';
        measurer.textContent = text;
        
        // Match exact text width + small buffer
        const width = measurer.getBoundingClientRect().width + 4;
        input.style.width = `${Math.max(width, 20)}px`;
    }

    // Attach resize listener to all dynamic inputs
    document.querySelectorAll('input.auto-size').forEach(input => {
        // Skip fixed 100% full width inputs from auto-resizing
        if (input.style.width === '100%') return;

        input.addEventListener('input', () => resizeInput(input));
        // Initialize width on load
        resizeInput(input);
    });

    // Real-time word counter logic
    descInput.addEventListener('input', () => {
        const text = descInput.value.trim();
        const wordCount = text === '' ? 0 : text.split(/\s+/).length;
        
        wordCountDisplay.textContent = `${wordCount} / ${MAX_WORDS} words`;

        if (wordCount > MAX_WORDS) {
            wordCountDisplay.classList.add('over-limit');
        } else {
            wordCountDisplay.classList.remove('over-limit');
        }
    });

    // Submit handler
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const text = descInput.value.trim();
        const wordCount = text === '' ? 0 : text.split(/\s+/).length;

        if (wordCount > MAX_WORDS) {
            alert(`Please shorten your description to ${MAX_WORDS} words or fewer. You are currently at ${wordCount} words.`);
            return;
        }

        submitBtn.value = "Sending...";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "thanks.html";
            } else {
                alert('Submission failed. Please try again.');
                submitBtn.value = "Submit Plaque Info";
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('Network error. Please try again.');
            submitBtn.value = "Submit Plaque Info";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
