<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gallery - Plaque Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        h2 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Plaque Preview Square */
        .plaque-box {
            border: 1px solid #000000;
            aspect-ratio: 1 / 1;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #ffffff;
            position: relative;
        }

        /* Dynamic Inline Layout */
        .inline-field-group {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            font-size: 13px;
        }
        .plaque-header {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Auto-sizing Input Styling */
        input.auto-size {
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            border: none;
            background: transparent;
            outline: none;
            padding: 0;
            margin: 0;
            color: #000000;
            min-width: 20px;
            width: auto;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: #888888;
        }

        textarea {
            font-family: inherit;
            font-size: 13px;
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            padding: 2px 0;
            color: #000000;
            box-sizing: border-box;
            resize: none;
            height: 100px;
            line-height: 1.4;
        }

        .word-count {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-bottom: 15px;
        }
        .word-count.over-limit {
            color: #d93025;
            font-weight: bold;
        }

        .meta-line {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            font-size: 13px;
            margin-top: 8px;
        }

        select {
            font-family: inherit;
            font-size: 13px;
            border: none;
            border-bottom: 1px solid #eee;
            background: transparent;
            outline: none;
            cursor: pointer;
            width: 100%;
            padding: 2px 0;
        }

        /* Physical Tag Representation (Bottom Right) */
        .tag-control-wrapper {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auto-color-label {
            font-size: 10px;
            color: #666666;
            text-align: right;
            max-width: 110px;
            line-height: 1.2;
            cursor: pointer;
            user-select: none;
        }

        .circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .circle-prompt {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666666;
            white-space: nowrap;
        }

        .circle-tag {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #000000;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            line-height: 1.1;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .circle-tag input[type="color"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .circle-tag.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .circle-tag.disabled input[type="color"] {
            cursor: not-allowed;
            pointer-events: none;
        }

        input[type="submit"] {
            font-family: inherit;
            font-size: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }
        input[type="submit"]:hover {
            background-color: #333333;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Hidden Mirror Element for calculating dynamic input width */
        #text-measurer {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            white-space: pre;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h2>Nova Gallery Plaque Form</h2>
    
    <form id="plaqueForm">
        <input type="hidden" name="access_key" value="ba406d16-9b73-4b6c-aaf7-e1ead6a55b0f">

        <span id="text-measurer"></span>

        <!-- Square Plaque Layout Container -->
        <div class="plaque-box">
            
            <!-- Top Section: Piece Title & Artist Name -->
            <div>
                <div class="inline-field-group plaque-header">
                    <input type="text" name="Piece Title" class="auto-size" placeholder="Piece Title" required>
                    <span>,&nbsp;</span>
                    <input type="text" name="Artist Name" class="auto-size" placeholder="Artist Name" required>
                </div>

                <!-- Description Paragraph with Word Counter -->
                <textarea id="descInput" name="Description" placeholder="Description..." required></textarea>
                <div id="wordCountDisplay" class="word-count">0 / 100 words</div>
            </div>

            <!-- Bottom Section: Technical Details & Meta -->
            <div style="padding-right: 180px;"> <!-- Prevents text from colliding with circle area -->
                
                <!-- Audio Field -->
                <div class="meta-line">
                    <span>Audio:&nbsp;</span>
                    <input type="text" name="Audio Track" class="auto-size" placeholder="Song / Audio Track (optional)" style="flex-grow: 1;">
                </div>

                <!-- Medium & Materials -->
                <div class="meta-line">
                    <input type="text" name="Medium & Materials" class="auto-size" placeholder="Medium (e.g., Oil on canvas)" style="width: 100%;" required>
                </div>

                <!-- Dimensions (Now directly on line below Medium) -->
                <div class="meta-line">
                    <input type="text" name="Dimensions" class="auto-size" placeholder="Dimensions (e.g., 61.5 x 61 cm)" style="width: 100%;" required>
                </div>

                <!-- Date/Year Field -->
                <div class="meta-line">
                    <span>(</span>
                    <input type="text" name="Year" class="auto-size" placeholder="2026" required>
                    <span>)</span>
                </div>

                <!-- For Sale Option -->
                <div class="meta-line" style="margin-top: 8px;">
                    <select name="For Sale" required>
                        <option value="" disabled selected>For sale?</option>
                        <option value="Available for sale">Available for sale</option>
                        <option value="Not for sale">Not for sale</option>
                    </select>
                </div>
            </div>

            <!-- Bottom-Right NFC Circle Representation & Color Selection -->
            <div class="tag-control-wrapper">
                <label class="auto-color-label" for="autoColorCheck">
                Dominant color from artwork
                </label>
                <input type="checkbox" id="autoColorCheck" name="Auto Select Dominant Color" value="Yes" style="cursor: pointer;">
                
                <div class="circle-container">
                    <span class="circle-prompt" id="circlePrompt">Pick colour</span>
                    <div class="circle-tag" id="colorCircle" title="Click to pick tag color">
                        TAP<br>HERE
                        <input type="color" id="tagColor" name="Tag Chosen Color" value="#ffffff">
                    </div>
                </div>
            </div>

        </div>

        <input type="submit" id="submitBtn" value="Submit Plaque Info">
    </form>

<script>
    const form = document.getElementById('plaqueForm');
    const submitBtn = document.getElementById('submitBtn');
    const descInput = document.getElementById('descInput');
    const wordCountDisplay = document.getElementById('wordCountDisplay');
    const measurer = document.getElementById('text-measurer');
    
    const tagColorInput = document.getElementById('tagColor');
    const colorCircle = document.getElementById('colorCircle');
    const autoColorCheck = document.getElementById('autoColorCheck');
    const circlePrompt = document.getElementById('circlePrompt');

    const MAX_WORDS = 100;

    // Handle Color Picker dynamic update
    tagColorInput.addEventListener('input', (e) => {
        if (autoColorCheck.checked) return;
        
        const hex = e.target.value;
        colorCircle.style.backgroundColor = hex;
        
        // Calculate contrast to switch text black/white automatically
        const r = parseInt(hex.substr(1,2),16);
        const g = parseInt(hex.substr(3,2),16);
        const b = parseInt(hex.substr(5,2),16);
        const yiq = ((r*299)+(g*587)+(b*114))/1000;
        
        colorCircle.style.color = (yiq >= 128) ? '#000000' : '#ffffff';
        colorCircle.style.borderColor = (yiq >= 200) ? '#000000' : hex;
    });

    // Handle Opt-Out Checkbox Toggle
    autoColorCheck.addEventListener('change', () => {
        if (autoColorCheck.checked) {
            colorCircle.classList.add('disabled');
            colorCircle.style.backgroundColor = 'transparent';
            colorCircle.style.color = '#000000';
            colorCircle.style.borderColor = '#000000';
            circlePrompt.style.opacity = '0.4';
            tagColorInput.disabled = true;
        } else {
            colorCircle.classList.remove('disabled');
            circlePrompt.style.opacity = '1';
            tagColorInput.disabled = false;
            tagColorInput.dispatchEvent(new Event('input'));
        }
    });

    // Auto-resize inputs as user types
    function resizeInput(input) {
        const style = window.getComputedStyle(input);
        measurer.style.fontSize = style.fontSize;
        measurer.style.fontWeight = style.fontWeight;
        
        const text = input.value || input.placeholder || '';
        measurer.textContent = text;
        
        const width = measurer.getBoundingClientRect().width + 4;
        input.style.width = `${Math.max(width, 20)}px`;
    }

    document.querySelectorAll('input.auto-size').forEach(input => {
        if (input.style.width === '100%') return;
        input.addEventListener('input', () => resizeInput(input));
        resizeInput(input);
    });

    // Real-time word counter logic
    descInput.addEventListener('input', () => {
        const text = descInput.value.trim();
        const wordCount = text === '' ? 0 : text.split(/\s+/).length;
        
        wordCountDisplay.textContent = `${wordCount} / ${MAX_WORDS} words`;

        if (wordCount > MAX_WORDS) {
            wordCountDisplay.classList.add('over-limit');
        } else {
            wordCountDisplay.classList.remove('over-limit');
        }
    });

    // Form Submission Handler
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const text = descInput.value.trim();
        const wordCount = text === '' ? 0 : text.split(/\s+/).length;

        if (wordCount > MAX_WORDS) {
            alert(`Please shorten your description to ${MAX_WORDS} words or fewer. You are currently at ${wordCount} words.`);
            return;
        }

        submitBtn.value = "Sending...";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "thanks.html";
            } else {
                alert('Submission failed. Please try again.');
                submitBtn.value = "Submit Plaque Info";
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('Network error. Please try again.');
            submitBtn.value = "Submit Plaque Info";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
